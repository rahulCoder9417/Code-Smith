[project]
name = "code-smith"
version = "0.1.0"
description = "An AI agentic coding mentor that teaches, quizzes and reviews code."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=3.13.0,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
]

[project.scripts]
code-smith = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
